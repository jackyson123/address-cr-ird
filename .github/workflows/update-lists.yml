name: Auto-update HK name lists

on:
  schedule:
    # 每日 01:00 UTC = 香港時間上午 09:00
    - cron: "0 1 * * *"
  workflow_dispatch: # 可手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install poppler (pdftotext)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download PDFs & build data
        run: python3 scripts/update_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: auto-update name lists $(date -u +%Y-%m-%d)"
            git push
          fi
