<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>香港名稱搜尋｜放債人 / 慈善團體</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --green: #22c55e;
      --orange: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 920px; margin: 0 auto; padding: 2rem 1.25rem; }
    h1 { font-size: 1.55rem; font-weight: 700; margin-bottom: 0.3rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .sub a { color: var(--accent); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.35rem;
      margin-bottom: 1.25rem;
    }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    input[type="text"] {
      flex: 1; min-width: 180px;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,.25);
    }
    button, .btn {
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }
    button:hover, .btn:hover { background: #2563eb; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-secondary:hover {
      border-color: var(--muted);
      color: var(--text);
      background: rgba(255,255,255,0.04);
    }
    .meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.85rem; }
    .meta a { color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { padding: 0.85rem 1rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: .04em; }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-flex; align-items: center; gap: .3rem;
      padding: 0.25rem 0.65rem; border-radius: 999px;
      font-size: 0.85rem; font-weight: 600;
    }
    .yes { background: rgba(34,197,94,.15); color: var(--green); }
    .no { background: rgba(139,155,180,.12); color: var(--muted); }
    .hits {
      margin-top: 0.45rem; font-size: 0.78rem; color: var(--muted);
      max-height: 160px; overflow-y: auto;
    }
    .hits div { padding: 0.2rem 0; border-bottom: 1px dashed var(--border); }
    .hits div:last-child { border-bottom: none; }
    .loading { color: var(--orange); }
    .footer { margin-top: 1.75rem; font-size: 0.75rem; color: var(--muted); text-align: center; }
    .hint {
      margin-top: 0.6rem;
      font-size: 0.78rem;
      color: var(--muted);
      display: none;
    }
    .hint.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>香港名稱搜尋</h1>
    <p class="sub">
      輸入公司／機構名稱，對照
      <a href="https://www.cr.gov.hk/en/statistics/docs/ml_licensees1.pdf" target="_blank" rel="noopener">放債人牌照名單</a>
      及
      <a href="https://www.ird.gov.hk/chi/pdf/s88list_emb.pdf" target="_blank" rel="noopener">稅務條例第88條慈善機構名單</a>
      。
    </p>

    <div class="card">
      <form id="form" class="row">
        <input type="text" id="q" placeholder="輸入名稱（中文或英文）…" autocomplete="off" required />
        <button type="submit" id="btn">搜尋</button>
        <a class="btn btn-secondary" id="updateBtn"
           href="https://github.com/jackyson123/address-cr-ird/actions/workflows/update-lists.yml"
           target="_blank" rel="noopener"
           title="開啟 GitHub Actions，按 Run workflow 即可手動更新">
          手動更新
        </a>
      </form>
      <div class="hint" id="updateHint">
        按「手動更新」後：在 GitHub 頁面右邊按 <strong>Run workflow</strong> → <strong>Run workflow</strong>，
        等綠色 ✓ 完成後，回到本頁 <strong>重新整理</strong> 即可用最新資料。
      </div>
      <div class="meta" id="status">載入資料中…</div>
    </div>

    <div class="card" id="resultCard" style="display:none">
      <table>
        <thead>
          <tr>
            <th>名稱</th>
            <th>放債人</th>
            <th>慈善團體</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td id="rName"></td>
            <td id="rMl"></td>
            <td id="rCh"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="footer">
      僅供參考，請以官方最新名單為準 · 每日自動更新 + 可手動更新（GitHub Actions）
    </div>
  </div>

  <script>
    // 你的 repo；若改名請一併改呢度
    const REPO_ACTIONS =
      "https://github.com/jackyson123/address-cr-ird/actions/workflows/update-lists.yml";

    const state = {
      ready: false,
      updated: null,
      mlText: "",
      chText: "",
      mlNames: [],
      chNames: [],
    };

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function findHits(haystack, needle, max = 12) {
      const n = needle.trim();
      if (!n || !haystack) return [];
      const lowerN = n.toLowerCase();
      const lines = haystack.split("\n");
      const hits = [];
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].toLowerCase().includes(lowerN)) {
          hits.push({ line: i + 1, text: lines[i].trim() });
          if (hits.length >= max) break;
        }
      }
      return hits;
    }

    function nameListHits(list, needle, max = 8) {
      const n = needle.trim().toLowerCase();
      if (!n) return [];
      const hits = [];
      for (const name of list) {
        if (name.toLowerCase().includes(n)) {
          hits.push(name);
          if (hits.length >= max) break;
        }
      }
      return hits;
    }

    function renderSide(found, hits, label) {
      if (!found) {
        return `<span class="badge no">— 未找到</span>`;
      }
      let html = `<span class="badge yes">✓ ${esc(label)}</span>`;
      if (hits.length) {
        html += `<div class="hits">` +
          hits.map(h => {
            if (typeof h === "string") return `<div>${esc(h)}</div>`;
            return `<div>L${h.line}: ${esc(h.text.slice(0, 140))}${h.text.length > 140 ? "…" : ""}</div>`;
          }).join("") +
          `</div>`;
      }
      return html;
    }

    function search(q) {
      const mlHitsText = findHits(state.mlText, q);
      const chHitsText = findHits(state.chText, q);
      const mlHitsName = nameListHits(state.mlNames, q);
      const chHitsName = nameListHits(state.chNames, q);

      const mlFound = mlHitsText.length > 0 || mlHitsName.length > 0;
      const chFound = chHitsText.length > 0 || chHitsName.length > 0;

      const mlShow = mlHitsName.length ? mlHitsName : mlHitsText;
      const chShow = chHitsName.length ? chHitsName : chHitsText;

      document.getElementById("rName").innerHTML = `<strong>${esc(q)}</strong>`;
      document.getElementById("rMl").innerHTML = renderSide(mlFound, mlShow, "放債人");
      document.getElementById("rCh").innerHTML = renderSide(chFound, chShow, "慈善團體");
      document.getElementById("resultCard").style.display = "block";
    }

    /** 同時支援根目錄同 data/ 資料夾 */
    async function fetchFirstOk(paths) {
      for (const p of paths) {
        try {
          const res = await fetch(p, { cache: "no-cache" });
          if (res.ok) return res;
        } catch (_) {}
      }
      return null;
    }

    async function loadData() {
      const status = document.getElementById("status");
      try {
        const [metaRes, mlRes, chRes] = await Promise.all([
          fetchFirstOk(["names.json", "data/names.json"]),
          fetchFirstOk(["ml_full.txt", "data/ml_full.txt"]),
          fetchFirstOk(["charity_full.txt", "data/charity_full.txt"]),
        ]);
        if (!metaRes || !mlRes || !chRes) {
          throw new Error("找不到 names.json / ml_full.txt / charity_full.txt（請確認已上傳到 repo 根目錄或 data/）");
        }
        const meta = await metaRes.json();
        state.updated = meta.updated;
        state.mlNames = meta.money_lender || [];
        state.chNames = meta.charity || [];
        state.mlText = await mlRes.text();
        state.chText = await chRes.text();
        state.ready = true;
        status.innerHTML =
          `資料更新日期：<strong>${esc(meta.updated || "未知")}</strong>` +
          ` · 放債人約 ${meta.money_lender_count ?? state.mlNames.length} 筆` +
          ` · 慈善團體約 ${meta.charity_count ?? state.chNames.length} 筆` +
          ` · <a href="${REPO_ACTIONS}" target="_blank" rel="noopener">手動更新說明</a>`;
        document.getElementById("btn").disabled = false;
      } catch (e) {
        status.innerHTML = `<span class="loading">載入失敗：${esc(String(e.message || e))}</span>`;
      }
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!state.ready) return;
      const q = document.getElementById("q").value.trim();
      if (q) search(q);
    });

    document.getElementById("updateBtn").addEventListener("click", () => {
      document.getElementById("updateHint").classList.add("show");
    });

    document.getElementById("btn").disabled = true;
    loadData();
  </script>
</body>
</html>
